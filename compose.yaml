name: enterprise-rag-ai-agent-platform

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-rag-ai-agent-platform:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_HTTP_PORT:-8000}:8000"
    environment:
      RAG_RUNTIME_ENV: production
      RAG_BOOTSTRAP_ADMIN_USERNAME: "${RAG_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      RAG_BOOTSTRAP_ADMIN_PASSWORD: "${RAG_BOOTSTRAP_ADMIN_PASSWORD:?Set RAG_BOOTSTRAP_ADMIN_PASSWORD in .env}"
      RAG_DB_PATH: /app/data/rag_platform.db
      RAG_UPLOAD_DIR: /app/data/uploads
      RAG_SESSION_TTL_HOURS: "${RAG_SESSION_TTL_HOURS:-12}"
      RAG_MIN_EVIDENCE_COVERAGE: "${RAG_MIN_EVIDENCE_COVERAGE:-0.7}"
      RAG_MAX_UPLOAD_MB: "${RAG_MAX_UPLOAD_MB:-10}"
      RAG_CORS_ORIGINS: "${RAG_CORS_ORIGINS:-}"
      AGENT_TASK_WORKERS: "${AGENT_TASK_WORKERS:-2}"
      AGENT_TASK_MAX_ACTIVE_PER_USER: "${AGENT_TASK_MAX_ACTIVE_PER_USER:-3}"
      AGENT_PLANNER_ENABLED: "${AGENT_PLANNER_ENABLED:-false}"
      AGENT_PLANNER_MODEL: "${AGENT_PLANNER_MODEL:-}"
      AGENT_PLANNER_TIMEOUT_SECONDS: "${AGENT_PLANNER_TIMEOUT_SECONDS:-15}"
      AGENT_TOOL_TIMEOUT_SECONDS: "${AGENT_TOOL_TIMEOUT_SECONDS:-25}"
      AGENT_TOOL_MAX_ATTEMPTS: "${AGENT_TOOL_MAX_ATTEMPTS:-2}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_INPUT_COST_PER_1K: "${LLM_INPUT_COST_PER_1K:-0}"
      LLM_OUTPUT_COST_PER_1K: "${LLM_OUTPUT_COST_PER_1K:-0}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-https://api.openai.com/v1}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-32}"
      EMBEDDING_TIMEOUT_SECONDS: "${EMBEDDING_TIMEOUT_SECONDS:-30}"
    volumes:
      - rag_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  rag_data:
