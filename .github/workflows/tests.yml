name: Tests

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify locked dependencies
        run: python check_requirements.py

      - name: Run tests
        run: python -m pytest

      - name: Run deterministic RAG quality gate
        run: python -m app.eval_gate_cli --output ../.runtime/evaluation-gate-report.json

      - name: Upload RAG quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-quality-gate-report
          path: .runtime/evaluation-gate-report.json
          if-no-files-found: error
